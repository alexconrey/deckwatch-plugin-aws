[package]
name = "deckwatch-plugin-aws"
version = "0.8.0"
edition = "2021"
description = "Deckwatch plugin — provisions AWS resources (IAM, RDS, S3) for Kubernetes workloads via direct AWS API calls"
repository = "https://github.com/alexconrey/deckwatch-plugin-aws"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to a release, never a branch, so the SDK only changes in a reviewed PR
# (Cargo.lock records the exact commit). Keep in step with integration/Cargo.toml.
deckwatch-plugin-sdk = { git = "https://github.com/alexconrey/deckwatch-plugin-sdk", tag = "v0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AWS Signature V4 signing — pure Rust, compiles to wasm32-unknown-unknown
hmac = "0.13"
sha2 = "0.11"

# extism-pdk only links on WASM — its host functions don't exist on native targets.
# Tests run on the host and must not link against it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
# Content-MD5 for S3 bucket-configuration PUTs (tagging, lifecycle), which
# require a message integrity header. Same RustCrypto digest family as sha2.
# Only content_md5() uses it, and that's compiled for wasm32 and tests, so it's
# a wasm32 dependency plus a dev-dependency. As a plain dependency, host builds
# warn that it's unused.
md-5 = "0.11"

[dev-dependencies]
md-5 = "0.11"
