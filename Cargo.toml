[package]
name = "deckwatch-plugin-aws"
version = "0.1.0"
edition = "2021"
description = "Deckwatch plugin — provisions AWS resources (IAM, RDS, S3) for Kubernetes workloads via direct AWS API calls"
repository = "https://github.com/alexconrey/deckwatch-plugin-aws"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckwatch-plugin-sdk = { git = "https://github.com/alexconrey/deckwatch-plugin-sdk", tag = "v0.5.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AWS Signature V4 signing — pure Rust, compiles to wasm32-unknown-unknown
hmac = "0.12"
sha2 = "0.10"

# extism-pdk only links on WASM — its host functions don't exist on native targets.
# Tests run on the host and must not link against it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
