[package]
name = "deckwatch-plugin-aws"
version = "0.8.0"
edition = "2021"
description = "Deckwatch plugin — provisions AWS resources (IAM, RDS, S3) for Kubernetes workloads via direct AWS API calls"
repository = "https://github.com/alexconrey/deckwatch-plugin-aws"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to a commit: lockfiles aren't committed, so a branch would build
# whatever the SDK's main is at release time. Keep in step with
# integration/Cargo.toml, and bump it in its own PR.
deckwatch-plugin-sdk = { git = "https://github.com/alexconrey/deckwatch-plugin-sdk", rev = "889d739976c7f0bb4f55f5e578133af69dea33f8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AWS Signature V4 signing — pure Rust, compiles to wasm32-unknown-unknown
hmac = "0.13"
sha2 = "0.11"
# Content-MD5 for S3 bucket-configuration PUTs (tagging, lifecycle), which
# require a message integrity header. Same RustCrypto digest family as sha2.
md-5 = "0.11"

# extism-pdk only links on WASM — its host functions don't exist on native targets.
# Tests run on the host and must not link against it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
